<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps I.E.S.P.</title>
<meta name="theme-color" content="#0F2147">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F2147;color:#F8FAFC;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:110px} h1{font-size:1.3rem;margin:12px 0 4px} p{color:#94A3B8;margin:0 0 22px}
  a{display:block;margin:10px auto;max-width:320px;padding:14px 18px;border-radius:14px;background:#2563EB;color:#fff;
    font-weight:700;text-decoration:none} a.g{background:transparent;border:2px solid #6CACE4}
</style>
</head>
<body>
<div>
  <img src="icons/icon-512.png" alt="">
  <h1>Instituto de Enseñanza Superior de Policía</h1>
  <p>Elija la aplicación</p>
  <a href="cadete/">🎓 Portal del Cadete</a>
  <a class="g" href="gestion/">🗂️ Legajos IESP – Gestión</a>
</div>
<script>
  // Si se abre desde el acceso instalado anterior (?source=app), ir directo al Portal del Cadete.
  if (location.search.includes("source=app")) location.replace("cadete/?source=app");
  // Quitar el service worker viejo de la raíz, que impedía instalar la app de gestión.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
    if (new URL(r.scope).pathname.replace(/\/$/, "").endsWith("/legajos-app")) r.unregister();
  }));
</script>
</body>
</html>
